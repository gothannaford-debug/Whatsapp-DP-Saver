# ملف واحد فقط: ضعه في مستودع GitHub على المسار .github/workflows/build-apk.yml
# ثم افتح Actions > Build WA Profile Saver APK > Run workflow
# وبعد النجاح نزّل الـ APK من Artifacts.
name: Build WA Profile Saver APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Generate Android project
        run: |
          mkdir -p proj && cd proj
          cat > settings.gradle <<'EOF_0'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "WaProfileDownloader"
          include ':app'
          EOF_0
          cat > build.gradle <<'EOF_1'
          plugins {
              id 'com.android.application' version '8.5.2' apply false
          }
          EOF_1
          cat > gradle.properties <<'EOF_2'
          org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8
          android.nonTransitiveRClass=true
          EOF_2
          mkdir -p app
          cat > app/build.gradle <<'EOF_3'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.example.wapfp'
              compileSdk 34

              defaultConfig {
                  applicationId "com.example.wapfp"
                  minSdk 29
                  targetSdk 34
                  versionCode 1
                  versionName "1.0"
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
                  encoding 'UTF-8'
              }
          }
          EOF_3
          mkdir -p app/src/main
          cat > app/src/main/AndroidManifest.xml <<'EOF_4'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.SYSTEM_ALERT_WINDOW" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_MEDIA_PROJECTION" />
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />

              <application
                  android:label="WA Profile Saver"
                  android:supportsRtl="true"
                  android:theme="@android:style/Theme.DeviceDefault.Light.NoActionBar">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>

                  <service
                      android:name=".OverlayService"
                      android:exported="false"
                      android:foregroundServiceType="mediaProjection" />
              </application>
          </manifest>
          EOF_4
          mkdir -p app/src/main/java/com/example/wapfp
          cat > app/src/main/java/com/example/wapfp/MainActivity.java <<'EOF_5'
          package com.example.wapfp;

          import android.Manifest;
          import android.app.Activity;
          import android.content.Intent;
          import android.content.pm.PackageManager;
          import android.media.projection.MediaProjectionManager;
          import android.net.Uri;
          import android.os.Build;
          import android.os.Bundle;
          import android.provider.Settings;
          import android.view.Gravity;
          import android.widget.Button;
          import android.widget.LinearLayout;
          import android.widget.TextView;
          import android.widget.Toast;

          public class MainActivity extends Activity {
              private static final int REQ_OVERLAY = 1, REQ_CAPTURE = 2, REQ_NOTIF = 3;
              private boolean askedNotif = false;

              @Override
              protected void onCreate(Bundle s) {
                  super.onCreate(s);
                  LinearLayout root = new LinearLayout(this);
                  root.setOrientation(LinearLayout.VERTICAL);
                  root.setGravity(Gravity.CENTER);
                  int p = (int) (24 * getResources().getDisplayMetrics().density);
                  root.setPadding(p, p, p, p);

                  TextView t = new TextView(this);
                  t.setTextSize(16);
                  t.setText("1) اضغط تشغيل ووافق على الصلاحيات.\n"
                          + "2) افتح واتساب وافتح صورة البروفايل (اضغط عليها لتظهر كبيرة).\n"
                          + "3) اضغط على الأيقونة الخضراء العائمة ⬇ وستُحفظ الصورة في المعرض داخل Pictures/WhatsApp Profile Pics.\n\n"
                          + "يمكنك سحب الأيقونة لتحريكها. للإيقاف اضغط زر الإيقاف.");
                  root.addView(t);

                  Button start = new Button(this);
                  start.setText("تشغيل الأيقونة العائمة");
                  start.setOnClickListener(v -> begin());
                  root.addView(start);

                  Button stop = new Button(this);
                  stop.setText("إيقاف");
                  stop.setOnClickListener(v -> startService(
                          new Intent(this, OverlayService.class).setAction(OverlayService.ACTION_STOP)));
                  root.addView(stop);

                  setContentView(root);
              }

              private void begin() {
                  if (!Settings.canDrawOverlays(this)) {
                      Toast.makeText(this, "فعّل «العرض فوق التطبيقات الأخرى» ثم ارجع", Toast.LENGTH_LONG).show();
                      startActivityForResult(new Intent(Settings.ACTION_MANAGE_OVERLAY_PERMISSION,
                              Uri.parse("package:" + getPackageName())), REQ_OVERLAY);
                      return;
                  }
                  if (Build.VERSION.SDK_INT >= 33 && !askedNotif
                          && checkSelfPermission(Manifest.permission.POST_NOTIFICATIONS)
                          != PackageManager.PERMISSION_GRANTED) {
                      askedNotif = true;
                      requestPermissions(new String[]{Manifest.permission.POST_NOTIFICATIONS}, REQ_NOTIF);
                      return;
                  }
                  MediaProjectionManager m = (MediaProjectionManager) getSystemService(MEDIA_PROJECTION_SERVICE);
                  startActivityForResult(m.createScreenCaptureIntent(), REQ_CAPTURE);
              }

              @Override
              protected void onActivityResult(int req, int res, Intent data) {
                  super.onActivityResult(req, res, data);
                  if (req == REQ_OVERLAY) {
                      if (Settings.canDrawOverlays(this)) begin();
                  } else if (req == REQ_CAPTURE && res == RESULT_OK && data != null) {
                      Intent i = new Intent(this, OverlayService.class);
                      i.putExtra("code", res);
                      i.putExtra("data", data);
                      startForegroundService(i);
                      moveTaskToBack(true);
                  }
              }

              @Override
              public void onRequestPermissionsResult(int req, String[] perms, int[] results) {
                  super.onRequestPermissionsResult(req, perms, results);
                  if (req == REQ_NOTIF) begin();
              }
          }
          EOF_5
          mkdir -p app/src/main/java/com/example/wapfp
          cat > app/src/main/java/com/example/wapfp/OverlayService.java <<'EOF_6'
          package com.example.wapfp;

          import android.app.Notification;
          import android.app.NotificationChannel;
          import android.app.NotificationManager;
          import android.app.PendingIntent;
          import android.app.Service;
          import android.content.ContentValues;
          import android.content.Intent;
          import android.content.pm.ServiceInfo;
          import android.graphics.Bitmap;
          import android.graphics.Color;
          import android.graphics.PixelFormat;
          import android.graphics.drawable.GradientDrawable;
          import android.hardware.display.DisplayManager;
          import android.hardware.display.VirtualDisplay;
          import android.media.Image;
          import android.media.ImageReader;
          import android.media.projection.MediaProjection;
          import android.media.projection.MediaProjectionManager;
          import android.net.Uri;
          import android.os.Environment;
          import android.os.Handler;
          import android.os.IBinder;
          import android.os.Looper;
          import android.provider.MediaStore;
          import android.util.DisplayMetrics;
          import android.view.Display;
          import android.view.Gravity;
          import android.view.MotionEvent;
          import android.view.View;
          import android.view.WindowManager;
          import android.widget.TextView;
          import android.widget.Toast;

          import java.io.OutputStream;
          import java.nio.ByteBuffer;

          public class OverlayService extends Service {
              static final String ACTION_STOP = "com.example.wapfp.STOP";
              private static final String CHANNEL = "wapfp_channel";

              private WindowManager wm;
              private TextView btn;
              private WindowManager.LayoutParams lp;
              private MediaProjection proj;
              private VirtualDisplay vd;
              private ImageReader reader;
              private int sw, sh;
              private final Handler main = new Handler(Looper.getMainLooper());

              @Override
              public IBinder onBind(Intent i) {
                  return null;
              }

              @Override
              public int onStartCommand(Intent i, int flags, int startId) {
                  if (i != null && ACTION_STOP.equals(i.getAction())) {
                      stopSelf();
                      return START_NOT_STICKY;
                  }
                  if (proj != null || i == null) return START_NOT_STICKY;

                  startFg();
                  try {
                      int code = i.getIntExtra("code", 0);
                      Intent data = i.getParcelableExtra("data");
                      MediaProjectionManager mpm = (MediaProjectionManager) getSystemService(MEDIA_PROJECTION_SERVICE);
                      proj = mpm.getMediaProjection(code, data);
                      proj.registerCallback(new MediaProjection.Callback() {
                          @Override
                          public void onStop() {
                              main.post(() -> stopSelf());
                          }
                      }, main);

                      DisplayMetrics dm = new DisplayMetrics();
                      DisplayManager dmg = (DisplayManager) getSystemService(DISPLAY_SERVICE);
                      dmg.getDisplay(Display.DEFAULT_DISPLAY).getRealMetrics(dm);
                      sw = dm.widthPixels;
                      sh = dm.heightPixels;

                      reader = ImageReader.newInstance(sw, sh, PixelFormat.RGBA_8888, 2);
                      vd = proj.createVirtualDisplay("wapfp", sw, sh, dm.densityDpi,
                              DisplayManager.VIRTUAL_DISPLAY_FLAG_AUTO_MIRROR, reader.getSurface(), null, null);

                      addButton(dm.density);
                  } catch (Exception e) {
                      toast("تعذر التشغيل: " + e.getMessage());
                      stopSelf();
                  }
                  return START_NOT_STICKY;
              }

              private void startFg() {
                  NotificationManager nm = getSystemService(NotificationManager.class);
                  nm.createNotificationChannel(new NotificationChannel(CHANNEL, "WA Profile Saver",
                          NotificationManager.IMPORTANCE_LOW));
                  PendingIntent stop = PendingIntent.getService(this, 0,
                          new Intent(this, OverlayService.class).setAction(ACTION_STOP),
                          PendingIntent.FLAG_IMMUTABLE);
                  Notification n = new Notification.Builder(this, CHANNEL)
                          .setContentTitle("WA Profile Saver يعمل")
                          .setContentText("اضغط الأيقونة العائمة لحفظ الصورة")
                          .setSmallIcon(android.R.drawable.ic_menu_gallery)
                          .addAction(0, "إيقاف", stop)
                          .build();
                  startForeground(1, n, ServiceInfo.FOREGROUND_SERVICE_TYPE_MEDIA_PROJECTION);
              }

              private void addButton(float d) {
                  wm = (WindowManager) getSystemService(WINDOW_SERVICE);
                  int size = (int) (56 * d);

                  btn = new TextView(this);
                  btn.setText("⬇");
                  btn.setTextColor(Color.WHITE);
                  btn.setTextSize(24);
                  btn.setGravity(Gravity.CENTER);
                  GradientDrawable bg = new GradientDrawable();
                  bg.setShape(GradientDrawable.OVAL);
                  bg.setColor(0xE625D366);
                  btn.setBackground(bg);

                  lp = new WindowManager.LayoutParams(size, size,
                          WindowManager.LayoutParams.TYPE_APPLICATION_OVERLAY,
                          WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE,
                          PixelFormat.TRANSLUCENT);
                  lp.gravity = Gravity.TOP | Gravity.START;
                  lp.x = sw - size - (int) (12 * d);
                  lp.y = sh / 3;

                  btn.setOnTouchListener(new View.OnTouchListener() {
                      int sx, sy;
                      float tx, ty;
                      boolean moved;

                      @Override
                      public boolean onTouch(View v, MotionEvent e) {
                          switch (e.getAction()) {
                              case MotionEvent.ACTION_DOWN:
                                  sx = lp.x;
                                  sy = lp.y;
                                  tx = e.getRawX();
                                  ty = e.getRawY();
                                  moved = false;
                                  return true;
                              case MotionEvent.ACTION_MOVE:
                                  float dx = e.getRawX() - tx, dy = e.getRawY() - ty;
                                  if (Math.abs(dx) > 15 || Math.abs(dy) > 15) moved = true;
                                  if (moved) {
                                      lp.x = sx + (int) dx;
                                      lp.y = sy + (int) dy;
                                      wm.updateViewLayout(btn, lp);
                                  }
                                  return true;
                              case MotionEvent.ACTION_UP:
                                  if (!moved) capture();
                                  return true;
                          }
                          return false;
                      }
                  });
                  wm.addView(btn, lp);
              }

              private void capture() {
                  btn.setVisibility(View.INVISIBLE); // so the icon is not part of the screenshot
                  main.postDelayed(() -> tryGrab(3), 300);
              }

              private void tryGrab(int attemptsLeft) {
                  Bitmap bmp = grab();
                  if (bmp == null && attemptsLeft > 1) {
                      main.postDelayed(() -> tryGrab(attemptsLeft - 1), 200);
                      return;
                  }
                  btn.setVisibility(View.VISIBLE);
                  if (bmp == null) {
                      toast("لم أتمكن من التقاط الشاشة، حاول مرة أخرى");
                      return;
                  }
                  final Bitmap cropped = autoCrop(bmp);
                  new Thread(() -> save(cropped)).start();
              }

              private Bitmap grab() {
                  Image img = reader.acquireLatestImage();
                  if (img == null) return null;
                  try {
                      Image.Plane p = img.getPlanes()[0];
                      ByteBuffer buf = p.getBuffer();
                      int ps = p.getPixelStride(), rs = p.getRowStride();
                      int padW = rs / ps;
                      Bitmap full = Bitmap.createBitmap(padW, sh, Bitmap.Config.ARGB_8888);
                      full.copyPixelsFromBuffer(buf);
                      Bitmap out = Bitmap.createBitmap(full, 0, 0, sw, sh);
                      full.recycle();
                      return out;
                  } finally {
                      img.close();
                  }
              }

              private static boolean dark(int c) {
                  return ((c >> 16) & 0xFF) < 40 && ((c >> 8) & 0xFF) < 40 && (c & 0xFF) < 40;
              }

              // WhatsApp's photo viewer shows the picture on a black background; trim the black parts.
              private Bitmap autoCrop(Bitmap b) {
                  int w = b.getWidth(), h = b.getHeight();
                  int[] px = new int[w * h];
                  b.getPixels(px, 0, w, 0, 0, w, h);

                  int top = -1, bottom = -1;
                  for (int y = 0; y < h; y++) {
                      int n = 0, tot = 0;
                      for (int x = 0; x < w; x += 4) {
                          tot++;
                          if (!dark(px[y * w + x])) n++;
                      }
                      if (n * 2 > tot) {
                          if (top < 0) top = y;
                          bottom = y;
                      }
                  }
                  if (top < 0 || bottom - top < h / 8) return b;

                  int left = -1, right = -1;
                  for (int x = 0; x < w; x++) {
                      int n = 0, tot = 0;
                      for (int y = top; y <= bottom; y += 4) {
                          tot++;
                          if (!dark(px[y * w + x])) n++;
                      }
                      if (n * 2 > tot) {
                          if (left < 0) left = x;
                          right = x;
                      }
                  }
                  if (left < 0 || right - left < w / 8) return b;
                  return Bitmap.createBitmap(b, left, top, right - left + 1, bottom - top + 1);
              }

              private void save(Bitmap bmp) {
                  try {
                      ContentValues v = new ContentValues();
                      v.put(MediaStore.Images.Media.DISPLAY_NAME, "wa_profile_" + System.currentTimeMillis() + ".jpg");
                      v.put(MediaStore.Images.Media.MIME_TYPE, "image/jpeg");
                      v.put(MediaStore.Images.Media.RELATIVE_PATH,
                              Environment.DIRECTORY_PICTURES + "/WhatsApp Profile Pics");
                      Uri u = getContentResolver().insert(MediaStore.Images.Media.EXTERNAL_CONTENT_URI, v);
                      if (u == null) throw new Exception("insert failed");
                      try (OutputStream o = getContentResolver().openOutputStream(u)) {
                          bmp.compress(Bitmap.CompressFormat.JPEG, 95, o);
                      }
                      toast("تم الحفظ في Pictures/WhatsApp Profile Pics");
                  } catch (Exception e) {
                      toast("فشل الحفظ: " + e.getMessage());
                  }
              }

              private void toast(String s) {
                  main.post(() -> Toast.makeText(getApplicationContext(), s, Toast.LENGTH_LONG).show());
              }

              @Override
              public void onDestroy() {
                  try {
                      if (btn != null && wm != null) wm.removeView(btn);
                  } catch (Exception ignored) {
                  }
                  btn = null;
                  if (vd != null) vd.release();
                  if (reader != null) reader.close();
                  MediaProjection p = proj;
                  proj = null;
                  if (p != null) p.stop();
                  super.onDestroy();
              }
          }
          EOF_6

      - name: Build debug APK
        working-directory: proj
        run: gradle assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: WA-Profile-Saver-apk
          path: proj/app/build/outputs/apk/debug/app-debug.apk
